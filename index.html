<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f5f5f0" />
    <title>Einkaufsliste</title>
    <link rel="stylesheet" href="style.css?v=1.4.2" />
  </head>
  <body>
    <main>
      <div class="title-row">
        <h1>🦝🐭 Einkaufsliste</h1>
        <div class="version-tag">v1.4.2</div>
      </div>

      <form class="add-item" id="add-item-form" hidden>
        <input id="item-text" type="text" placeholder="z.B. Milch" autocomplete="off" required />
        <input id="item-category" type="text" placeholder="Kategorie" autocomplete="off" list="category-list" />
        <datalist id="category-list"></datalist>
        <button type="submit">+</button>
      </form>

      <div class="search-row" id="search-row" hidden>
        <input id="search-input" type="search" placeholder="Suchen…" autocomplete="off" />
      </div>

      <div id="categories"></div>
      <div class="empty" id="empty-state" hidden>Noch nichts auf der Liste.</div>
      <div class="empty" id="loading-state">Lade…</div>

      <div class="bulk-actions" id="bulk-actions" hidden>
        <button id="check-all-btn" class="secondary">Alles abhaken</button>
        <button id="uncheck-all-btn" class="secondary">Alles zurücksetzen</button>
      </div>

      <div class="card" id="share-card" hidden>
        <div class="hint">Diesen Link teilen, damit andere dieselbe Liste sehen:</div>
        <div class="share-row">
          <input id="share-link" type="text" readonly />
          <button id="copy-link" class="secondary">Kopieren</button>
        </div>
      </div>
    </main>

    <script src="config.js?v=1.4.2"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=1.4.2"></script>
  </body>
</html>
