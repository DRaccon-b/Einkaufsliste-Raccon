<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#f3ece0" />
    <title>Einkaufsliste</title>
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="style.css?v=1.23.0" />
  </head>
  <body>
    <div class="pager" id="pager">
      <section class="page page-a" data-suffix="">
        <div class="page-inner">
          <div class="title-row">
            <h1>🦝🐭 Einkaufsliste</h1>
            <div class="version-tag">v1.23.0</div>
          </div>

          <form class="add-item" id="add-item-form" hidden>
            <input id="item-text" type="text" placeholder="z.B. Milch" autocomplete="off" required />
            <select id="item-category" class="category-select" aria-label="Kategorie"></select>
            <input
              id="item-category-custom"
              type="text"
              class="category-custom-input"
              placeholder="Neue Kategorie"
              autocomplete="off"
              hidden
            />
            <button type="submit">+</button>
          </form>

          <div class="search-row" id="search-row" hidden>
            <input id="search-input" type="search" placeholder="Suchen…" autocomplete="off" />
          </div>

          <label class="filter-row" id="filter-row" hidden>
            <input type="checkbox" id="hide-checked-filter" />
            Nur unerledigte anzeigen
          </label>

          <div id="categories"></div>
          <div class="empty" id="empty-state" hidden>Noch nichts auf der Liste.</div>
          <div class="empty" id="loading-state">Lade…</div>

          <div class="bulk-actions" id="bulk-actions" hidden>
            <button id="check-all-btn" class="secondary">Alles abhaken</button>
            <button id="uncheck-all-btn" class="secondary">Alles zurücksetzen</button>
          </div>

          <div class="page-dots">
            <span class="dot active"></span>
            <span class="dot"></span>
          </div>

          <div class="card" id="share-card" hidden>
            <div class="hint">Diesen Link teilen, damit andere dieselbe Liste sehen:</div>
            <div class="share-row">
              <input id="share-link" type="text" readonly />
              <button id="copy-link" class="secondary">Kopieren</button>
            </div>
          </div>

          <div class="settings-toolbar">
            <button type="button" id="home-btn" class="icon-btn" title="Zur Liste" aria-label="Zur Liste">🏠</button>
            <button
              type="button"
              id="settings-btn"
              class="icon-btn"
              title="Darstellung"
              aria-label="Darstellung"
              aria-expanded="false"
            >
              ⚙️
            </button>
          </div>

          <div class="settings-panel" id="settings-panel" hidden>
            <div class="settings-panel-title">Farbe</div>
            <div class="settings-panel-hint">Färbt beide Listen passend ein</div>
            <div class="theme-swatches">
              <button type="button" class="theme-swatch" data-theme-color="warm" aria-label="Warm (Standard)">
                <span class="theme-swatch-dot"></span>
                <span class="theme-swatch-label">Warm</span>
              </button>
              <button type="button" class="theme-swatch" data-theme-color="ocean" aria-label="Ozean">
                <span class="theme-swatch-dot"></span>
                <span class="theme-swatch-label">Ozean</span>
              </button>
              <button type="button" class="theme-swatch" data-theme-color="forest" aria-label="Wald">
                <span class="theme-swatch-dot"></span>
                <span class="theme-swatch-label">Wald</span>
              </button>
              <button type="button" class="theme-swatch" data-theme-color="berry" aria-label="Beere">
                <span class="theme-swatch-dot"></span>
                <span class="theme-swatch-label">Beere</span>
              </button>
            </div>
          </div>
        </div>
      </section>

      <section class="page page-b" data-suffix="-b">
        <div class="page-inner">
          <div class="title-row">
            <h1>🍅 Rewe zweite Wahl</h1>
          </div>

          <form class="add-item" id="add-item-form-b" hidden>
            <input id="item-text-b" type="text" placeholder="z.B. Milch" autocomplete="off" required />
            <select id="item-category-b" class="category-select" aria-label="Kategorie"></select>
            <input
              id="item-category-custom-b"
              type="text"
              class="category-custom-input"
              placeholder="Neue Kategorie"
              autocomplete="off"
              hidden
            />
            <button type="submit">+</button>
          </form>

          <div class="search-row" id="search-row-b" hidden>
            <input id="search-input-b" type="search" placeholder="Suchen…" autocomplete="off" />
          </div>

          <label class="filter-row" id="filter-row-b" hidden>
            <input type="checkbox" id="hide-checked-filter-b" />
            Nur unerledigte anzeigen
          </label>

          <div id="categories-b"></div>
          <div class="empty" id="empty-state-b" hidden>Noch nichts auf der Liste.</div>
          <div class="empty" id="loading-state-b">Lade…</div>

          <div class="bulk-actions" id="bulk-actions-b" hidden>
            <button id="check-all-btn-b" class="secondary">Alles abhaken</button>
            <button id="uncheck-all-btn-b" class="secondary">Alles zurücksetzen</button>
          </div>

          <div class="page-dots">
            <span class="dot"></span>
            <span class="dot active"></span>
          </div>
        </div>
      </section>
    </div>

    <script src="config.js?v=1.23.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <script src="app.js?v=1.23.0"></script>
  </body>
</html>
